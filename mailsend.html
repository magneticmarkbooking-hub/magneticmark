  <style>
    :root {
      --c1: #0a0015;
      --c2: #1a0035;
      --c4: #6600ff;
      --c5: #0055ff;
      --accent: #7b2fff;
      --gold: #ffd700;
      --white: #ffffff;
      --gray: #aaaacc;
      --text: #e0d8ff;
      --gradient: linear-gradient(135deg, var(--c4), var(--c5));
      --gradient-bg: linear-gradient(180deg, var(--c1) 0%, var(--c2) 50%, #000820 100%);

      --font-body: 'Barlow', sans-serif;
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--gradient-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(123,47,255,0.3);
      border-radius: 8px;
      padding: 48px 40px;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 32px;
      text-align: center;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(123,47,255,0.4);
      border-radius: 4px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: border-color var(--transition), background var(--transition);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: rgba(123,47,255,0.8);
      background: rgba(255,255,255,0.10);
    }

    textarea { min-height: 140px; resize: vertical; }

    button[type="submit"] {
      width: 100%;
      padding: 14px 40px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(102,0,255,0.4);
      transition: transform var(--transition), box-shadow var(--transition);
      margin-top: 8px;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 50px rgba(102,0,255,0.6);
    }

    #status {
      text-align: center;
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 1.4em;
      color: var(--gray);
    }

    /* ── Stopka preview ── */
    .sig-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      margin: 32px 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sig-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(123,47,255,0.25);
    }

    .sig-preview-wrap {
      border: 1px solid rgba(123,47,255,0.3);
      border-radius: 6px;
      overflow: hidden;
      background: #0a0015;
    }

    #sig-iframe {
      width: 100%;
      border: none;
      display: block;
      /* height ustawiane przez JS po załadowaniu */
      min-height: 300px;

      </div>
      <div class="field">

      <button type="submit">Send</button>

<html>
<head>
<meta charset="UTF-8">
<style>

    iframe.srcdoc = iframeDoc;

    /* Auto-wysokość iframe po załadowaniu */
    iframe.addEventListener('load', () => {
      try {
        const h = iframe.contentDocument.body.scrollHeight;
        iframe.style.height = h + 'px';
      } catch(e) {}
    });

    /* ── Send ── */
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "Sending...";

      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd);

      /* Pełne HTML emaila: treść + stopka z v10 */
      const footer = `
        <div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;">
          <table cellpadding="0" cellspacing="0" border="0" width="100%">
            <!-- TREŚĆ -->

              </td>
            </tr>
            ${SIGNATURE_HTML}
          </table>
        </div>`;

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...data, footer }),
        });
        const json = await res.json();
        status.textContent = json.success ? "✅ Sent!" : "❌ Error: " + json.error;
      } catch (err) {
        status.textContent = "❌ " + err.message;
      }
    });
